# Mixture Selection — GMM Configuration (Grid Layout)
# =====================================================
# 36 Gaussians on a 6x6 lattice → 265 candidate mixtures.

gmm:
  # Layout geometry: "grid" (36 Gaussians on a 6x6 lattice)
  layout: "grid"

  # Standard deviation of each Gaussian (isotropic: covariance = sigma^2 * I)
  sigma: 0.08

  # Random seed for reproducibility
  random_seed: 42

  # --- Ring layout parameters (unused for grid) ---
  n_components: 16
  radius: 1.0

  # --- Grid layout parameters ---
  # Number of rows in the 2D lattice
  grid_rows: 6

  # Number of columns in the 2D lattice
  grid_cols: 6

  # Spacing between adjacent grid points (grid is centered at origin)
  grid_spacing: 0.4

  # --- Random 3D layout parameters (unused for grid) ---
  random_3d_scale: 2.0
  random_3d_cov_scale: 1.0

sampling:
  # Number of i.i.d. samples to draw from each candidate mixture
  n_samples: 5000

  # Directory where .npz sample files are saved
  output_dir: "data/samples"

visualization:
  # Visual style: "light" | "dark"
  style: "light"

  # Output resolution
  dpi: 150

  # Default figure size in inches (width, height)
  figsize: [10, 10]

  # Directory where figures are saved
  figure_dir: "figures"

  # Total points to plot in mixture-selection view
  total_samples: 8000

  # Point alpha for scatter
  scatter_alpha: 0.35

  # Point size for scatter
  scatter_point_size: 1.2
