# Mixture Selection — GMM Configuration (Random 3D Layout)
# ==========================================================
# 16 random 3D Gaussians with full PSD covariances → 140 candidate mixtures.
# NOTE: This layout has no visualization support (3D data).

gmm:
  # Layout geometry: "random_3d" (N random 3D Gaussians)
  layout: "random_3d"

  # Standard deviation (unused for random_3d — components use full covariances)
  sigma: 0.08

  # Random seed for reproducibility (controls means and covariances)
  random_seed: 42

  # --- Ring layout parameters (unused for random_3d) ---
  n_components: 20
  radius: 1.0

  # --- Grid layout parameters (unused for random_3d) ---
  grid_rows: 6
  grid_cols: 6
  grid_spacing: 0.4

  # --- Random 3D layout parameters ---
  # Means drawn uniformly from [-random_3d_scale, random_3d_scale]^3
  random_3d_scale: 2.0

  # Scale of entries in random matrix A where cov = A @ A^T
  random_3d_cov_scale: 1.0

sampling:
  # Number of i.i.d. samples to draw from each candidate mixture
  n_samples: 5000

  # Directory where .npz sample files are saved
  output_dir: "data/samples"

visualization:
  # Visual style: "light" | "dark"
  style: "light"

  # Output resolution
  dpi: 150

  # Default figure size in inches (width, height)
  figsize: [10, 10]

  # Directory where figures are saved
  figure_dir: "figures"

  # Total points to plot in mixture-selection view
  total_samples: 8000

  # Point alpha for scatter
  scatter_alpha: 0.35

  # Point size for scatter
  scatter_point_size: 1.2
